# This action will use hemtt release to build and sign the mod, then
# attach the resulting zip to the GitHub release.
#
# Steam Workshop publishing is handled separately via `hemtt publish`
# (https://hemtt.dev), not by this workflow.
#
# Models are binarized with Arma 3 Tools, as ACE does: the repository secret
# ARMA3_TOOLS_URL points to a privately hosted zip of an Arma 3 Tools install.
# Without the secret the release is built without binarizing the models.

name: Release

on:
  release:
    types: released

permissions:
  contents: write

jobs:
  release-addon:
    runs-on: windows-latest
    env:
      ARMA3_TOOLS_URL: ${{ secrets.ARMA3_TOOLS_URL }}
    steps:
      - name: Install Arma 3 Tools
        if: ${{ env.ARMA3_TOOLS_URL != '' }}
        uses: arma-actions/arma3-tools@master
        with:
          toolsUrl: ${{ env.ARMA3_TOOLS_URL }}

      - name: Checkout the source code
        uses: actions/checkout@v7

      - name: Setup HEMTT
        uses: arma-actions/hemtt@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Authenticated API requests to avoid rate limits

      - name: Run HEMTT build
        run: hemtt release

      - name: Upload release to GitHub
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: releases/ewc-latest.zip
          asset_name: ewc-${{ github.ref_name }}.zip
          tag: ${{ github.ref }}
          overwrite: true
